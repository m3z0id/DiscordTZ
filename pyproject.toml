[project]
name = "TimezoneBot"
version = "1.0.0"
description = "A Discord bot for keeping track of people's timezones"
authors = [{name="M3z0id"}]
requires-python = ">=3.13"

dependencies = [
    "datetime==6.0",
    "asyncio==4.0.0",
    "cryptography==48.0.0",
    "geoip2==5.2.0",
    "pytz==2026.2",
    "requests==2.33.1",
    "tzlocal==5.3.1",
    "dataclasses-json==0.6.7",
    "aiosqlite==0.22.1",
    "aiomysql==0.3.2",
    "aiofiles==25.1.0",
    "numpy==2.4.4",
    "audioop-lts>=0.2.2",
    "discord-py>=2.7.1",
    "pyjwt>=2.12.1",
    "pillow==12.2.0",
    "landlock>=1.0.0.dev5 ; sys_platform == 'linux'",
    "msgpack==1.1.2",
    "aiohttp>=3.13.5",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "packetsender.py"
]
target-version = "py313"
line-length = 150
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",        # Docstring
    "ANN002",   # *args type annotation
    "ANN003",   # **kwargs type annotation
    "C901",     # function too complex
    "COM812",   # Trailing comma
    "DTZ005",   # datetime without timezone
    "ERA001",   # Commented out code
    "EM102",    # error message with no variables
    "FBT003",   # Boolean positional argument
    "INP001",   # __init__.py in packages
    "N802",     # lowercase function names
    "N803",     # lowercase arg names
    "N805",     # self in member functions
    "N806",     # lowercase var names
    "N815",     # mixCaseOmg
    "N816",     # camelCase
    "PLR0912",  # Too many branches
    "PGH004",   # Blanket noqa
    "PTH123",   # Path.open()
    "RUF006",   # Storing return value of a function
    "RUF012",   # Annotation with @typing.ClassVar
    "S104",     # Binding to all interfaces
    "S112",     # Logging exceptions
    "S606",     # Starting process without a shell
    "SLF001",   # Private member accessed
    "TRY003",   # Long exception message
    "TRY300",   # Use else block instead of catch
]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
